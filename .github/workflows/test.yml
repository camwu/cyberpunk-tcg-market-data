name: Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - 'prices/**'
      - 'cards.json'
      - 'README.md'
      - 'COPYING'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'prices/**'
      - 'cards.json'
      - 'README.md'
      - 'COPYING'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

  test:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Confirm Python compatibility test completion
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "Python compatibility matrix failed or was cancelled."
            exit 1
          fi
          echo "All Python compatibility matrix runners passed successfully."
