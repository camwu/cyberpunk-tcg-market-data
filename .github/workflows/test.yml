name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

  test:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Confirm cross-platform test completion
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "Cross-platform test matrix failed or was cancelled."
            exit 1
          fi
          echo "All cross-platform matrix runners passed successfully."
