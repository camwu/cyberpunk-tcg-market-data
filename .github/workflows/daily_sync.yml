name: Daily Market Price Scrape

on:
  schedule:
    # 20:30 UTC daily (1:30 PM PDT / 4:30 PM EDT)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scrape.py prices

      - name: Create Pull Request for market updates
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            prices/
            cards.json
          commit-message: "Auto-update market prices & catalog"
          title: "Auto-update market prices & catalog"
          body: "Automated daily market price scrape and catalog sync via TCGCSV."
          branch: "data/daily-sync"
          delete-branch: true
