name: Daily Market Price Scrape

on:
  schedule:
    # 20:30 UTC daily (1:30 PM PDT / 4:30 PM EDT)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_SYNC_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scrape.py prices

      - name: Commit and push if prices updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices/ cards.json
          if git diff --staged --quiet; then
            echo "No price or catalog changes to commit."
          else
            git commit -m "Auto-update market prices & catalog: $(date -u +'%Y-%m-%d')"
            git push origin main
          fi
